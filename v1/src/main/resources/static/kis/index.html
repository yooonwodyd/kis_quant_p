<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIS 연결 테스트</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2328;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }
    .panel {
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      height: 34px;
      border: 1px solid #d8dee4;
      border-radius: 6px;
      background: #f6f8fa;
      padding: 0 12px;
      font-weight: 650;
      cursor: pointer;
    }
    input {
      height: 34px;
      border: 1px solid #d8dee4;
      border-radius: 6px;
      padding: 0 10px;
    }
    pre {
      min-height: 360px;
      overflow: auto;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
<main>
  <h1>KIS 실계좌 연결 테스트</h1>

  <section class="panel">
    <h2>조회</h2>
    <div class="buttons">
      <button onclick="callApi('GET', '/api/kis/token')">토큰</button>
      <button onclick="callApi('GET', '/api/kis/account/balance')">잔고</button>
      <button onclick="callApi('GET', '/api/kis/account/holdings')">보유 주식</button>
      <button onclick="callApi('GET', '/api/kis/quotes/001510')">001510 현재가</button>
    </div>
    <p>
      <input id="price" inputmode="numeric" placeholder="지정가">
      <button onclick="buyable()">매수 가능</button>
    </p>
  </section>

  <section class="panel">
    <h2>실전 주문</h2>
    <div class="buttons">
      <button onclick="liveBuy()">1주 지정가 매수</button>
      <button onclick="marketBuy()">1주 시장가 매수</button>
      <button onclick="liveSell()">1주 지정가 매도</button>
      <button onclick="marketSell()">1주 시장가 매도</button>
    </div>
  </section>

  <section class="panel">
    <h2>주문/체결</h2>
    <p>
      <input id="orderNo" placeholder="ODNO">
      <input id="orgNo" placeholder="KRX_FWDG_ORD_ORGNO">
    </p>
    <div class="buttons">
      <button onclick="orderStatus()">주문 조회</button>
      <button onclick="cancelOrder()">미체결 취소</button>
      <button onclick="callApi('GET', '/api/kis/executions/today')">당일 체결</button>
    </div>
  </section>

  <pre id="result">대기 중</pre>
</main>

<script>
const result = document.getElementById('result');

function price() {
  return document.getElementById('price').value.trim();
}

async function callApi(method, path) {
  result.textContent = `${method} ${path}\n요청 중`;
  try {
    const response = await fetch(path, { method });
    const text = await response.text();
    result.textContent = text ? JSON.stringify(JSON.parse(text), null, 2) : '{}';
  } catch (error) {
    result.textContent = String(error);
  }
}

function buyable() {
  const value = price();
  if (!value) {
    result.textContent = '지정가를 입력';
    return;
  }
  callApi('GET', `/api/kis/orders/buyable?symbol=001510&price=${encodeURIComponent(value)}`);
}

function requirePrice() {
  const value = price();
  if (!value) {
    result.textContent = '지정가를 입력';
    return null;
  }
  return value;
}

function orderNo() {
  return document.getElementById('orderNo').value.trim();
}

function orgNo() {
  return document.getElementById('orgNo').value.trim();
}

function liveBuy() {
  const value = requirePrice();
  if (value) {
    callApi('POST', `/api/kis/orders/live-buy?price=${encodeURIComponent(value)}`);
  }
}

function liveSell() {
  const value = requirePrice();
  if (value) {
    callApi('POST', `/api/kis/orders/live-sell?price=${encodeURIComponent(value)}`);
  }
}

function marketBuy() {
  callApi('POST', '/api/kis/orders/market-buy');
}

function marketSell() {
  callApi('POST', '/api/kis/orders/market-sell');
}

function orderStatus() {
  const organizationNo = orgNo();
  const query = organizationNo ? `?krxOrderOrgNo=${encodeURIComponent(organizationNo)}` : '';
  callApi('GET', `/api/kis/orders/${encodeURIComponent(orderNo())}${query}`);
}

function cancelOrder() {
  callApi('POST', `/api/kis/orders/${encodeURIComponent(orderNo())}/cancel?krxOrderOrgNo=${encodeURIComponent(orgNo())}`);
}
</script>
</body>
</html>
